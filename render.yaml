# Render Blueprint for the RaktSetu API (Dashboard -> New -> Blueprint -> pick this repo).
# Values marked sync: false are asked for when the Blueprint is created; see README "Deploy".
services:
  - type: web
    name: raktsetu-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    # Deploys come from GitHub Actions (.github/workflows/main.yml) after the tests pass.
    autoDeploy: false
    envVars:
      - key: MONGO_URI          # MongoDB Atlas connection string (mongodb+srv://...)
        sync: false
      # The site (on Vercel) allowed to call the API (CORS); comma-separate several.
      # The first one also names the site in the login SMS ("@raktsetu.zorvx.shop #123456").
      - key: FRONTEND_ORIGIN
        value: https://raktsetu.zorvx.shop
      - key: JWT_SECRET
        generateValue: true
      - key: DB_NAME
        value: raktsetu
      - key: ENVIRONMENT
        value: production
      # No SMS provider is connected, so the demo shows the login code on screen.
      - key: SHOW_OTP
        value: "true"
      # The demo data is generated as of this date; keeping it fixed keeps the demo cases stable.
      - key: AS_OF_DATE
        value: "2026-11-13"
      - key: SEARCH_RADIUS_KM
        value: "25"
      - key: CITY_CACHE_CAPACITY
        value: "2"   # Atlas holds Ahmedabad and Vadodara
