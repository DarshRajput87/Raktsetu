# Render Blueprint for the RaktSetu API (Dashboard -> New -> Blueprint -> pick this repo).
# Values marked sync: false are asked for when the Blueprint is created; see README "Deploy".
services:
  - type: web
    name: raktsetu-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MONGO_URI          # MongoDB Atlas connection string (mongodb+srv://...)
        sync: false
      - key: FRONTEND_ORIGIN    # the Vercel URL, e.g. https://raktsetu.vercel.app (comma-separate several)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_NAME
        value: raktsetu
      - key: ENVIRONMENT
        value: production
      # No SMS provider is connected, so the demo shows the login code on screen.
      - key: SHOW_OTP
        value: "true"
      # The demo data is generated as of this date; keeping it fixed keeps the demo cases stable.
      - key: AS_OF_DATE
        value: "2026-11-13"
      - key: SEARCH_RADIUS_KM
        value: "25"
      - key: CITY_CACHE_CAPACITY
        value: "2"   # Atlas holds Ahmedabad and Vadodara
